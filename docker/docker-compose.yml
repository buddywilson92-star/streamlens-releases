# StreamLens in Docker, the standard setup, for any computer with Docker:
# Linux, a NAS (Synology, Unraid, TrueNAS, QNAP) or Docker Desktop on Windows
# and macOS. Bridge network: only the dashboard port is published.
# Guide: https://github.com/buddywilson92-star/streamlens-releases/blob/main/docker/README.md
# The other files next to this one there:
#   docker-compose.host.yml      host networking (Linux only): StreamLens on
#                                your Windows PCs finds this one by itself
#   docker-compose.plex.yml      StreamLens and Plex together (also .jellyfin.yml,
#   and .emby.yml)               reached by the service name
#
#   Linux or a NAS:   mkdir -p data && sudo chown 1000:1000 data
#                     (or start as root with PUID/PGID: the guide, "Starting as root with PUID and PGID")
#   Docker Desktop:   nothing to prepare (Docker makes the data folder)
#   docker compose up -d
#   open http://<this computer's address>:3737 (the setup code is in: docker logs streamlens)
#
# The same in one command, without this file (Linux: make the data folder first):
#   docker run -d --name streamlens --hostname streamlens --restart unless-stopped --init --user 1000:1000 -p 3737:3737 --add-host host.docker.internal:host-gateway -e TZ=Etc/UTC -v "$PWD/data:/data" --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true --sysctl "net.ipv4.ping_group_range=0 2147483647" docker.io/tntdevteam/streamlens:1
name: streamlens
services:
  streamlens:
    image: docker.io/tntdevteam/streamlens:1
    container_name: streamlens
    hostname: streamlens                 # shown as this computer's name
    restart: unless-stopped              # also what brings it back after Restart in Settings (it exits with code 3)
    init: true                           # reaps the ping and nvidia-smi child processes
    user: "1000:1000"                    # must be able to write to ./data (see the guide for your NAS)
    ports:
      - "3737:3737"                      # dashboard: other devices open http://<this computer's address>:3737
    extra_hosts:
      # a media server on this same computer is at http://host.docker.internal:<its port>
      # (Docker Desktop has that name anyway; this line gives it to Linux too)
      - "host.docker.internal:host-gateway"
    environment:
      TZ: "Etc/UTC"                      # your time zone, e.g. America/Chicago
      # Optional. Values set here win over Settings while they are set, and
      # Settings shows them as "set by the container" (the guide, "Settings from the container"):
      # STREAMLENS_NAME: "Living room NAS"            # the name other computers see
      # STREAMLENS_ADDRESSES: "192.168.1.10"          # the address your phones use (this computer's LAN address)
      # PLEX_URL: "http://host.docker.internal:32400" # Plex on this same computer; or its address, e.g. http://192.168.1.10:32400
      # PLEX_TOKEN_FILE: /run/secrets/plex_token      # with the secrets: lines below; setup's Plex sign-in is easier
      # JELLYFIN_URL: "http://192.168.1.10:8096"      # Jellyfin instead of Plex (beta)
      # JELLYFIN_API_KEY_FILE: /run/secrets/jellyfin_api_key  # Jellyfin: Dashboard, API Keys
      # EMBY_URL: "http://192.168.1.10:8096"          # Emby instead of Plex (beta)
      # EMBY_API_KEY_FILE: /run/secrets/emby_api_key  # Emby: the gear icon, Advanced, Api Keys
      # STREAMLENS_PATH_MAP: "/volume1/video=/media"  # where Plex sees your media=where it is mounted below
    # A key from a file (a Docker secret) never sits in this file, in the image or
    # in "docker inspect". Put the key alone in ./secrets/plex_token.txt, readable
    # by user 1000 (or your PUID), then uncomment these two lines and the secrets: block at the end:
    # secrets:
    #   - plex_token                     # (or jellyfin_api_key, emby_api_key)
    volumes:
      - ./data:/data                     # settings, history, logs: keep this folder private
      # Optional: Plex's log folder, read-only, for the Dolby Vision and CPU-fallback evidence
      # - "/path/to/Plex Media Server/Logs:/plex-logs:ro"
      # Optional: your media, read-only, for keyframe analysis (see STREAMLENS_PATH_MAP above)
      # - "/path/to/media:/media:ro"
    # Graphics tiles (the guide, "Graphics: NVIDIA, AMD and Intel"): AMD and Intel
    # graphics show without anything here. StreamLens reads their load from /sys and
    # never needs /dev/dri (that is for the media server's container).
    # Optional: how much of the graphics the media server's conversions use (and the
    # media server's memory and conversion count) needs this computer's process list,
    # with the media server running as the same user as StreamLens:
    # Trade-off: with the same user, StreamLens could also read the media server's files
    # (Plex's key in Preferences.xml) and stop its processes. Leave it off unless you
    # accept that (the guide, "pid: host: a trade-off").
    # pid: host
    # Optional, an NVIDIA card (Linux with the NVIDIA Container Toolkit installed):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu, utility]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"   # ping viewers without extra privileges
    stop_grace_period: 15s
# secrets:
#   plex_token:
#     file: ./secrets/plex_token.txt
#   jellyfin_api_key:
#     file: ./secrets/jellyfin_api_key.txt
#   emby_api_key:
#     file: ./secrets/emby_api_key.txt
